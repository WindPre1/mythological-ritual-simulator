# Hard cap of undug burrows at once (starts + chain). Never more than this.
# Extra burrows despawn with a chat message until at or under this cap.
start-burrows: 7
chain-length: 10
treasure-chance: 0.33
close-detect-range: 32
echo-plings: 12
sounds: true

# Spawn is locked to SBO HUB_BOUNDS, inset so arrow ray origin (block center) stays inside.
# x [-282..174], y [61..104], z [-207..204], grass with completely open sky.
spawn:
  min-separation: 8

practice-rates: false
rate-multiplier: 1
elusive-weight-multiplier: 1.0
default-griffin: MYTHIC
magic-find: 390
tracking: 0
gaia-hit-chance: 0.333333

regen-seconds: 3
regen-hearts: 1
natural-regeneration: false

# Folder of Hypixel mytho skin PNGs / hash .txt files (HUNTER.png, KING.txt, …).
# Falls back to plugins/RitualPractice/MythoSkins if this path is missing.
